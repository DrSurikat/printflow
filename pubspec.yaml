name: printflow
description: Застосунок для керування замовленнями PrintFlow
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI helpers
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  gap: ^3.0.1
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.4.0
  equatable: ^2.0.5

  # PDF invoice
  pdf: ^3.11.1
  printing: ^5.13.2

  # Deep links (Telegram, Viber, Instagram)
  url_launcher: ^6.3.1

  # HTTP (Nova Poshta API, update checker)
  http: ^1.2.2

  # Version info (update checker)
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
